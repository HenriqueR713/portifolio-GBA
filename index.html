<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meu Portfólio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="console">

    <!-- =====================================================
       BLOCO DE CONTROLES: D-pad + A/B (fundo e botões) juntos.
    ===================================================== -->
    <div class="controles-wrapper">

      <div class="dpad-wrapper">
        <img id="dpadImg" class="dpad-img" src="images/components_ext/dpad/dpad.png" alt="D-pad">
        <button class="dpad-zone zone-up"    data-dir="up"    type="button" aria-label="Cima"></button>
        <button class="dpad-zone zone-left"  data-dir="left"  type="button" aria-label="Esquerda"></button>
        <button class="dpad-zone zone-right" data-dir="right" type="button" aria-label="Direita"></button>
        <button class="dpad-zone zone-down"  data-dir="down"  type="button" aria-label="Baixo"></button>
      </div>

      <div class="ab-bg-wrapper">
        <img class="ab-bg" src="images/components_ext/ab/ab_bg.png" alt="">
      </div>

      <div class="ab-buttons-wrapper">
        <img id="btnB" class="ab-btn btn-b" src="images/components_ext/ab/b_btn.png" alt="Botão B">
        <img id="btnA" class="ab-btn btn-a" src="images/components_ext/ab/a_btn.png" alt="Botão A">
      </div>

    </div>

    <!-- =====================================================
       TELA INICIAL (HOME)
    ===================================================== -->
    <div class="screen-wrapper" id="homeScreen">
      <img id="homeBase" class="screen-bg"
           src="images/pages/home/home_page_base.png" alt="Tela inicial">

      <div class="home-content">

        <img class="home-foto"
             src="images/pages/home/components_int/foto/foto.png" alt="Foto de perfil">

        <div class="home-info">
          <img class="home-label home-label-name"
               src="images/pages/home/components_int/name.png" alt="Nome">
          <img class="home-label home-label-contact" id="contactLabel"
               src="images/pages/home/components_int/contatct/contact.png" alt="Contato">
          <img class="home-skills-badge" id="skillsBadge"
               src="images/pages/home/components_int/skills/skills.png" alt="Skills">
        </div>

        <div class="home-nav">
          <img class="home-nav-btn" id="btnCursos"
               src="images/pages/home/components_int/cursos/cursos.png" alt="Cursos">
          <img class="home-nav-btn" id="btnProjetos"
               src="images/pages/home/components_int/projetos/projetos.png" alt="Projetos">
          <img class="home-nav-btn" id="btnFormacao"
               src="images/pages/home/components_int/formacao/formacao.png" alt="Formação">
        </div>

      </div>
    </div>

    <!-- =====================================================
       TELA DE SKILLS
    ===================================================== -->
    <div class="screen-wrapper" id="skillsPage" hidden>
      <img class="screen-bg"
           src="images/pages/skills/skill_page.png" alt="Skills">

      <div class="skills-sprite-wrapper">
        <img class="skills-sprite" id="skillsSprite"
             src="images/pages/skills/animation_pixel/preview.webp" alt="Personagem animado">
      </div>
    </div>

    <!-- =====================================================
       TELA DE CURSOS
       Agora são 3 imagens separadas (uma por curso), cada uma
       com sua PRÓPRIA posição no CSS (#itemRockseat / #itemIFPE /
       #itemCocacola). O JS mostra só a do curso ativo (classe
       ".oculto" nas outras) — nunca 2 visíveis ao mesmo tempo.
       Ordem: rockseat -> IFPE -> cocacola.
    ===================================================== -->
    <div class="screen-wrapper" id="cursosPage" hidden>
      <img class="screen-bg"
           src="images/pages/cursos/cursos_page.png" alt="Cursos">

      <div class="cursos-lista">
        <img class="curso-item" id="itemRockseat" src="" alt="Rockseat">
        <img class="curso-item" id="itemIFPE"     src="" alt="IFPE">
        <img class="curso-item" id="itemCocacola" src="" alt="Coca-Cola Jovem">
      </div>

      <div class="curso-painel">
        <img class="curso-titulo"   id="cursoTitulo"   src="" alt="Título do curso">
        <img class="curso-foto"     id="cursoFoto"     src="" alt="Certificado do curso">
        <img class="curso-carga"    id="cursoCarga"    src="" alt="Carga horária">
        <img class="curso-data"     id="cursoData"     src="" alt="Data">
        <img class="curso-status"   id="cursoStatus"   src="" alt="Status">
        <img class="curso-texto"    id="cursoTexto"    src="" alt="Descrição do curso">
        <img class="curso-expandir" id="cursoExpandir"
             src="images/pages/cursos/expandir.png" alt="Expandir">
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
